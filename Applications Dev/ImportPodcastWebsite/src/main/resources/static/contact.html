<!DOCTYPE html>

* {

body {

}

h1 {

    padding-bottom: 1rem;
}

input {
    padding: 0.5rem;
    border-radius: 0.5rem;
    border: 1px solid #1E1E1E;
}

.container {
    padding: 4rem;
    background-color: #F2F2F2;
    border: 1rem solid #1E1E1E;
    border-radius: 2rem;
}

.label_input {

}

button {

}

a {

}
