<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Molebogeng's Website</title>
</head>
<body>

<h1>Contact Molebogeng</h1>

<div>
    <label>Name:</label><br>
    <input type="text" id="userNameBox" placeholder="Enter your name">
</div>
<br>

<div>
    <label>Surname:</label><br>
    <input type="text" id="userSurnameBox" placeholder="Enter your surname">
</div>
<br>

<div>
    <label>Email:</label><br>
    <input type="email" id="userEmailBox" placeholder="Enter your email">
</div>
<br>

<div>
    <label>Message:</label><br>
    <textarea id="userMessageBox" placeholder="Type your message here"></textarea>
</div>
<br>

<button onclick="contactMe()">Submit Form</button>


<!-- We will print the backend's response here -->
<p id="response-text" style="color: orange;"></p>

<script>
    function contactMe() {
        const typedName = document.getElementById("userNameBox").value;
            const typedSurname = document.getElementById("userSurnameBox").value;
            const typedEmail = document.getElementById("userEmailBox").value;
            const typedMessage = document.getElementById("userMessageBox").value;

            const envelope = {
                name: typedName,
                surname: typedSurname,
                email: typedEmail,
                message: typedMessage
            };

            fetch('http://localhost:8080/contactMe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(envelope)
            })
            .then(response => response.text())
            .then(data => {
                // Print Java's "Success!" message onto the screen
                document.getElementById("response-text").innerText = data;

                // --- THE NEW TRICK: Clear the boxes! ---
                document.getElementById("userNameBox").value = "";
                document.getElementById("userSurnameBox").value = "";
                document.getElementById("userEmailBox").value = "";
                document.getElementById("userMessageBox").value = "";
            })
            .catch(error => {
                console.error("Error:", error);
            });
    }
</script>

</body>
</html>
