<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KoKo — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    
    .login-box {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .login-box h1 { font-size: 2.5rem; color: #2d6a4f; margin-bottom: 0.3rem; }
    .login-box p { color: #6c757d; margin-bottom: 2rem; font-size: 0.95rem; }
    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; }
    .tab {
      flex: 1; padding: 0.7rem; text-align: center;
      cursor: pointer; color: #6c757d; font-weight: 600;
    }
    .tab.active { color: #2d6a4f; border-bottom: 2px solid #2d6a4f; margin-bottom: -2px; }
  </style>
</head>
<body>
  <div class="app-theme">
    <div class="login-box">
      <div id="intro">
        <h1> KoKo</h1>
        <p>Connecting rural communities to local businesses</p>
      </div>

      <div class="tabs">
        <div class="tab active" onclick="showTab('login', event)">Sign In</div>
        <div class="tab" onclick="showTab('register', event)">Register</div>
      </div>

      <div id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <div id="login-error" class="alert alert-error" style="display:none;"></div>
        <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Sign In</button>
      </div>

      <div id="register-form" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="+27 000 000 0000" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" />
        </div>
        <div id="reg-error" class="alert alert-error" style="display:none;"></div>
        <button class="btn btn-primary" style="width:100%" onclick="handleRegister()">Create Account</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showTab(tab, event) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    }
  </script>
</body>
</html>
