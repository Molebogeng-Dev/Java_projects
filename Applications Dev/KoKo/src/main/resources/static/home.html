<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Koko — Find Local Businesses</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map { height: 300px; border-radius: 12px; margin-bottom: 2rem; }
    .search-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .search-bar input { flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
    .search-bar select { padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
    .category-badge { font-size: 0.8rem; color: #6c757d; margin-bottom: 0.5rem; }
  
    
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="logo"> KoKo </span>
    <div>
      <a href="orders.html">My Orders</a>
      <a href="profile.html">Profile</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container">
    
    <div id="intro">
      <h2>Find Businesses Near You</h2>
      <p style="color:#6c757d; margin-bottom:1.5rem;">Click on the map to set your location and find local businesses</p>
    </div>
    <div id="map"></div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Search businesses..." oninput="filterBusinesses()" />
      <select id="category" onchange="filterBusinesses()">
        <option value="">All Categories</option>
        <option value="grocery">Grocery</option>
        <option value="pharmacy">Pharmacy</option>
        <option value="hardware">Hardware</option>
        <option value="food">Food & Drink</option>
        <option value="clothing">Clothing</option>
      </select>
    </div>

    <div id="business-grid" class="grid grid-3"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="js/map.js"></script>
  <script>
    requireAuth();
    let allBusinesses = [];

    async function loadBusinesses(lat, lng) {
      const data = await getBusinesses(lat, lng);
      allBusinesses = data;
      renderBusinesses(data);
    }

    function renderBusinesses(businesses) {
      const grid = document.getElementById("business-grid");
      if (!businesses || businesses.length === 0) {
        grid.innerHTML = "<p>No businesses found in this area. Click the map to search.</p>";
        return;
      }
      grid.innerHTML = businesses.map(b => `
        <div class="card" onclick="window.location.href='catalogue.html?id=${b.id}'">
          <div style="background:#d8f3dc; height:140px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; margin-bottom:1rem;">🏪</div>
          <div class="category-badge">${b.category}</div>
          <h3>${b.name}</h3>
          <p style="color:#6c757d; font-size:0.9rem; margin-top:0.3rem;">${b.address}</p>
          <p style="color:#2d6a4f; font-size:0.85rem; margin-top:0.5rem;">📍 ${b.distance} km away</p>
          <button class="btn btn-primary" style="margin-top:1rem; width:100%">View Products</button>
        </div>
      `).join("");
    }

    function filterBusinesses() {
      const search = document.getElementById("search").value.toLowerCase();
      const category = document.getElementById("category").value;
      const filtered = allBusinesses.filter(b => {
        const matchSearch = b.name.toLowerCase().includes(search);
        const matchCategory = category === "" || b.category === category;
        return matchSearch && matchCategory;
      });
      renderBusinesses(filtered);
    }
  </script>
</body>
</html>
